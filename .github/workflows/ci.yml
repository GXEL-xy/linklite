name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 类型检查 + 集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 初始化本地数据库
        run: npm run db:schema:local

      - name: 启动本地 Worker
        run: |
          nohup npm run dev > wrangler-dev.log 2>&1 &
          echo $! > dev.pid
          echo "等待 wrangler dev 就绪..."
          for i in $(seq 1 60); do
            if curl -fsS -m 3 http://127.0.0.1:8787/health > /dev/null 2>&1; then
              echo "ready after ${i}x2s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::wrangler dev 120s 未就绪"
          cat wrangler-dev.log
          exit 1

      - name: 冒烟测试
        run: node scripts/smoke.mjs http://127.0.0.1:8787

      - name: 输出 dev 日志
        if: failure()
        run: cat wrangler-dev.log || true

      - name: 关闭 dev server
        if: always()
        run: |
          if [ -f dev.pid ]; then
            kill "$(cat dev.pid)" 2>/dev/null || true
          fi
          pkill -f "wrangler dev" 2>/dev/null || true
